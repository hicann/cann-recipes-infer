model_name: "kimi_k3"
model_path: "/data/models/kimi_k3"
draft_model_path: "/data/models/kimi_k3_dspark"
exe_mode: "npugraph_ex"
world_size: 32

model_config:
  with_ckpt: True
  enable_online_split_weight: True
  enable_profiler: False
  enable_static_kernel: True
  enable_cache_compile: False
  enable_weight_nz: False
  platform_version: "950"
  draft_model_type: "dspark"
  next_n: 7
  skip_warm_up: True
  prefill_mini_batch_size: 1
  pa_block_size: 128
  custom_params:
    attn_res_mode: "fused"
    enable_multi_streams: True
    moe_chunk_max_len: 65536
    enable_flash_kda: True
    enable_fused_recurrent_kda: False

data_config:
  dataset: "default"
  input_max_len: 128
  max_new_tokens: 128
  batch_size: 32
  temperature: 1.0

parallel_config:
  attn_tp_size: 32
  moe_tp_size: 1
  embed_tp_size: 16
  lmhead_tp_size: 8
  dense_tp_size: 8
  oproj_tp_size: 32
  cp_size: 1
