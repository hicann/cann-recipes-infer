model_config:
  model_name: "kimi_k3"
  # Same real MXFP4 K3 checkpoint as the eager config, run under npugraph_ex
  # so the quantized decode path is exercised in graph mode.
  model_path: "/data/models/kimi_k3"
  exe_mode: "npugraph_ex"
  enable_profiler: False
  enable_static_kernel: True          # npugraph_ex only: compile operators to static kernels
  enable_weight_nz: False
  with_ckpt: True
  custom_params:
    attn_res_mode: "original"
    enable_multi_streams: True
    enable_flash_kda: True
    moe_chunk_max_len: 65536

data_config:
  dataset: "default"
  input_truncated_len: 128

parallel_config:
  world_size: 32
  attn_tp_size: 32
  offline_prefill_dp_group_size: 32
  moe_tp_size: 1
  embed_tp_size: 32
  lmhead_tp_size: 32
  dense_tp_size: 32
  o_proj_tp_size: 32

scheduler_config:
  batch_size: 32
  max_new_tokens: 128
  max_prefill_tokens: 128
