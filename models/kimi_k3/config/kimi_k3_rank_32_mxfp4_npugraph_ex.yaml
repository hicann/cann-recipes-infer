model_name: "kimi_k3"
model_path: "/data/models/kimi_k3"
exe_mode: "npugraph_ex"
world_size: 32

model_config:
  with_ckpt: True
  enable_online_split_weight: True
  enable_profiler: False
  enable_static_kernel: True
  enable_cache_compile: False
  enable_weight_nz: False
  platform_version: "950"
  draft_model_type: "none"
  next_n: 0
  skip_warm_up: True
  prefill_mini_batch_size: 1
  pa_block_size: 128
  custom_params:
    attn_res_mode: "fused"
    enable_multi_streams: True
    enable_flash_kda: True
    enable_fused_recurrent_kda: True
    moe_chunk_max_len: 12800
    enable_mega_moe: True
    enable_moe_bf16_mode: True

data_config:
  dataset: "InfiniteBench"
  input_max_len: 16384
  max_new_tokens: 256
  batch_size: 32
  temperature: 0.0

parallel_config:
  attn_tp_size: 32
  moe_tp_size: 1
  embed_tp_size: 16
  lmhead_tp_size: 8
  dense_tp_size: 8
  oproj_tp_size: 32
  cp_size: 1
