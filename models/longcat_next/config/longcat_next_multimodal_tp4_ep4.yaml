model_name: longcat_next
world_size: 4

model_config:
  model_name: longcat_next
  model_path: your_model_path
  dtype: bfloat16
  with_ckpt: True
  exe_mode: eager                    # ["eager", "ge_graph", "npugraph_ex"]
  enable_cache_compile: False        # [False, True]
  enable_dynamic_graph: True         # [False, True]
  enable_static_kernel: False        # [False, True]
  enable_profiler: False             # [False, True]
  force_eplb: False                  # [False, True]
  next_n: 0
  custom_params:
    moe_chunk_max_len: 1024
    decompose_post_attn0_rmsnorm: True
    multimodal:
      request_file: requests/text.json   # 需自行创建，见 README“推理执行”第 2 步；相对 models/longcat_next/ 解析
      head_tp_size: 4                # generation head TP size; 1 = single owner
      head_exe_mode: eager           # ["eager", "ge_graph", "npugraph_ex"]
      head_enable_cache_compile: False  # [False, True]
      enable_thinking: False         # [False, True, null]; text output tasks only
      image_decoder_path: image_decoder/image_decoder.safetensors  # relative to model_path
      vocoder_path: cosy24k_vocoder/hift.pt                        # relative to model_path
      generation:
        do_sample: True              # text output sampling
        temperature: 0.7
        top_p: 0.9
        top_k: 50
      visual_generation_config:
        do_sample: True
        temperature: 0.5
        top_p: 0.75
        top_k: 1024
        custom_params:
          cfg_scale: 1.8
          token_h: 37
          token_w: 37
          anyres_prefix: "<longcat_img_token_size>{h} {w}</longcat_img_token_size>"
      audio_generation_config:
        audio_parallel_decoding: False
        do_sample: False
        temperature: 0.5
        top_k: 5
        top_p: 0.85
        repetition_penalty: 1.3
        custom_params:
          sampling_rate: 24000
          wave_concat_overlap: 1200

data_config:
  dataset: longcat_multimodal
  input_truncated_len: 2048
  seed: 336

parallel_config:
  world_size: 4
  attn_tp_size: 4
  dense_tp_size: 4
  moe_tp_size: 1                     # 1 = EP4, 4 = TP4-only
  embed_tp_size: 4
  lmhead_tp_size: 4
  o_proj_tp_size: 4

scheduler_config:
  block_size: 128
  max_new_tokens: 2048
  max_prefill_tokens: 4096
  batch_size: 2                      # runtime value set by run_multimodal: 2 for image generation (CFG), else 1
