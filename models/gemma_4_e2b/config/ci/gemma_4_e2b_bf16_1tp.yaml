model_config:
  model_name: "gemma_4_e2b"
  model_path: "your_model_path"
  exe_mode: "eager"
  with_ckpt: true
  enable_profiler: false
  enable_cache_compile: false
  enable_static_kernel: false
data_config:
  dataset: "default"
  input_truncated_len: 128
parallel_config:
  world_size: 1
  attn_tp_size: 1
  moe_tp_size: 1
  embed_tp_size: 1
  lmhead_tp_size: 1
  dense_tp_size: 1
scheduler_config:
  max_new_tokens: 8
  max_prefill_tokens: 128
  batch_size: 1
