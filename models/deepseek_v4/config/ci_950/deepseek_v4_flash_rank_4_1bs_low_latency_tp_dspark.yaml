model_config:
  model_name: "deepseek_v4"
  model_path: "/model/DeepSeek-V4-Flash-DSpark"
  platform_version: "950"
  with_ckpt: True
  exe_mode: "npugraph_ex"
  enable_static_kernel: False
  enable_dynamic_graph: False
  enable_profiler: False
  force_eplb: False
  enable_cache_compile: False
  custom_params:
    low_latency_tp: True
    enable_multi_streams: True
    moe_chunk_max_len: 65536

speculative_config:
  num_speculative_tokens: 5
  method: "dspark"
  draft_model_path: ""
  confidence_threshold: 0.0
  draft_temperature:

data_config:
  dataset: "default"
  input_truncated_len: 8192
  temperature: 1.0

parallel_config:
  world_size: 4
  cp_size: 1
  attn_tp_size: 4
  dense_tp_size: 1
  moe_tp_size: 4
  embed_tp_size: 4
  lmhead_tp_size: 4
  o_proj_tp_size: 4

scheduler_config:
  block_size: 128
  max_new_tokens: 256
  max_prefill_tokens: 8192
  batch_size: 1
