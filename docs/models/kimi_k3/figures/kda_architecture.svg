<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 KDA layer</title>
  <desc id="desc">High-level Kimi K3 KDA layer diagram for editorial use. Input projections feed a fused KDA operator containing Q/K normalization, decay and beta activation, and recurrent state update. A separate output gate joins after RMSNorm and before the output projection.</desc>
  <defs>
    <style>
      svg { background: #ffffff; color: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .panel { fill: #ffffff; stroke: #242424; stroke-width: 1.8; }
      .fusion { fill: #fff8ed; stroke: #a75c2b; stroke-width: 2.3; }
      .projection { fill: #f6d8d1; stroke: #242424; stroke-width: 1.4; }
      .compute { fill: #d4e5f8; stroke: #242424; stroke-width: 1.4; }
      .gate { fill: #f0efbd; stroke: #242424; stroke-width: 1.4; }
      .state { fill: #eeeeef; stroke: #242424; stroke-width: 1.4; }
      .io { fill: #ffffff; stroke: #242424; stroke-width: 1.4; }
      .title { font-size: 25px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .section { font-size: 19px; font-weight: 700; dominant-baseline: central; }
      .label { font-size: 17px; font-weight: 650; text-anchor: middle; dominant-baseline: central; }
      .small { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
      .subhead { font-size: 14px; font-weight: 650; fill: #a75c2b; dominant-baseline: central; }
      .flow { fill: none; stroke: #242424; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #777777; stroke-width: 1.6; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#242424"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#777777"/>
    </marker>
  </defs>

  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="800" y="30" class="title">Kimi K3 KDA layer</text>

  <!-- Input projections. -->
  <rect x="25" y="65" width="460" height="420" rx="12" class="panel"/>
  <text x="50" y="92" class="section">Input projections</text>

  <rect x="55" y="220" width="140" height="70" rx="8" class="io"/>
  <text x="125" y="255" class="label">hidden states</text>
  <path d="M195 255 H230" class="flow"/>
  <path d="M230 150 V440" class="flow"/>

  <path d="M230 150 H270" class="flow" marker-end="url(#arrow)"/>
  <rect x="270" y="115" width="190" height="70" rx="8" class="projection"/>
  <text x="365" y="141" class="label">QKV projection</text>
  <text x="365" y="166" class="small">+ causal Conv1D</text>

  <path d="M230 255 H270" class="flow" marker-end="url(#arrow)"/>
  <rect x="270" y="220" width="190" height="70" rx="8" class="projection"/>
  <text x="365" y="246" class="label">decay projection</text>
  <text x="365" y="271" class="small">f_a_proj -&gt; f_b_proj</text>

  <path d="M230 360 H270" class="flow" marker-end="url(#arrow)"/>
  <rect x="270" y="325" width="190" height="70" rx="8" class="projection"/>
  <text x="365" y="351" class="label">beta projection</text>
  <text x="365" y="376" class="small">b_proj</text>

  <path d="M230 440 H270" class="flow" marker-end="url(#arrow)"/>
  <rect x="270" y="405" width="190" height="70" rx="8" class="projection"/>
  <text x="365" y="431" class="label">output gate</text>
  <text x="365" y="456" class="small">full-rank or low-rank path</text>

  <!-- Fused KDA. -->
  <rect x="515" y="65" width="670" height="420" rx="12" class="fusion"/>
  <text x="540" y="92" class="section">Fused KDA operator</text>
  <text x="1155" y="92" class="subhead" text-anchor="end">Includes normalization, recurrent gates and state update</text>

  <rect x="560" y="115" width="230" height="70" rx="8" class="compute"/>
  <text x="675" y="141" class="label">Q/K L2Norm</text>
  <text x="675" y="166" class="small">Q scaling; V passes through</text>

  <rect x="560" y="220" width="230" height="70" rx="8" class="gate"/>
  <text x="675" y="246" class="label">decay activation</text>
  <text x="675" y="271" class="small">A_log, dt_bias, lower_bound</text>

  <rect x="560" y="325" width="230" height="70" rx="8" class="gate"/>
  <text x="675" y="351" class="label">beta activation</text>
  <text x="675" y="376" class="small">sigmoid(raw_beta)</text>

  <!-- Inputs align horizontally with their fused preprocessing stages. -->
  <path d="M460 150 H560" class="flow" marker-end="url(#arrow)"/>
  <path d="M460 255 H560" class="flow" marker-end="url(#arrow)"/>
  <path d="M460 360 H560" class="flow" marker-end="url(#arrow)"/>

  <rect x="850" y="165" width="270" height="190" rx="9" class="compute"/>
  <text x="985" y="208" class="label">KDA recurrence</text>
  <text x="985" y="247" class="small">Prefill: chunked Flash KDA</text>
  <text x="985" y="276" class="small">Decode: fused recurrent KDA</text>
  <text x="985" y="315" class="small">BF16 output + FP32 state update</text>

  <!-- Three preprocessing paths converge without crossing. -->
  <path d="M790 150 H820 V205 H850" class="flow" marker-end="url(#arrow)"/>
  <path d="M790 255 H850" class="flow" marker-end="url(#arrow)"/>
  <path d="M790 360 H820 V315 H850" class="flow" marker-end="url(#arrow)"/>

  <rect x="875" y="405" width="220" height="50" rx="8" class="state"/>
  <text x="985" y="430" class="label">FP32 recurrent state</text>
  <path d="M940 355 V405" class="flow" marker-end="url(#arrow)"/>
  <path d="M1030 405 V355" class="flow" marker-end="url(#arrow)"/>

  <!-- Output path. -->
  <rect x="1215" y="65" width="360" height="420" rx="12" class="panel"/>
  <text x="1240" y="92" class="section">Output path</text>

  <rect x="1260" y="115" width="270" height="70" rx="8" class="compute"/>
  <text x="1395" y="141" class="label">per-head RMSNorm</text>
  <text x="1395" y="166" class="small">normalize KDA output</text>
  <path d="M1120 260 H1190 V150 H1260" class="flow" marker-end="url(#arrow)"/>

  <rect x="1260" y="220" width="270" height="75" rx="8" class="gate"/>
  <text x="1395" y="247" class="label">output gating</text>
  <text x="1395" y="273" class="small">o_norm(y) * sigmoid(raw_gate)</text>
  <path d="M1395 185 V220" class="flow" marker-end="url(#arrow)"/>

  <rect x="1260" y="330" width="270" height="70" rx="8" class="projection"/>
  <text x="1395" y="356" class="label">o_proj</text>
  <text x="1395" y="381" class="small">RowParallelLinear + TP reduce-scatter</text>
  <path d="M1395 295 V330" class="flow" marker-end="url(#arrow)"/>

  <rect x="1305" y="430" width="180" height="40" rx="8" class="io"/>
  <text x="1395" y="450" class="label">layer output</text>
  <path d="M1395 400 V430" class="flow" marker-end="url(#arrow)"/>

  <!-- The output-gate branch bypasses KDA and joins only at output gating. -->
  <path d="M460 440 H495 V515 H1235 V257 H1260" class="dashed" marker-end="url(#arrow-gray)"/>
</svg>
