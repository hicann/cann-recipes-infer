<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 overall architecture</title>
  <desc id="desc">KDA and Stable LatentMoE mechanism cards beside the Kimi K3 Block AttnRes backbone. Independent block-anchor rails and the current block partial feed learned alpha aggregators before every attention and feed-forward sublayer.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="5.5" markerHeight="5.5" refX="5.1" refY="2.75" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#334155"/></marker>
    <marker id="attn-arrow" markerWidth="5.5" markerHeight="5.5" refX="5.1" refY="2.75" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5.5 2.75 L0 5.5 Z" fill="#9A5862"/></marker>
    <marker id="bus-arrow" markerWidth="4.5" markerHeight="4.5" refX="4.1" refY="2.25" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L4.5 2.25 L0 4.5 Z" fill="#9A5862"/></marker>
    <marker id="control-arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5 2.5 L0 5 Z" fill="#A97B14"/></marker>
    <style>
      .panel-title { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .backbone-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .node { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #26364B; }
      .label { font: 550 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #526176; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #667085; }
      .micro { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #667085; }
      .badge { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #FFFFFF; }
      .alpha { font: italic 650 13px Georgia, "Times New Roman", serif; fill: #9A3E4E; }
      .data { fill: none; stroke: #334155; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#data-arrow); }
      .candidate { fill: none; stroke: #9A5862; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#attn-arrow); }
      .anchor-tap { fill: none; stroke: #9A5862; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#bus-arrow); }
      .state { fill: none; stroke: #78879A; stroke-width: 1.25; stroke-dasharray: 4 4; stroke-linecap: round; }
      .control { fill: none; stroke: #A97B14; stroke-width: 1.35; stroke-dasharray: 4 3; stroke-linecap: round; marker-end: url(#control-arrow); }
      .weight { fill: none; stroke: #526176; stroke-width: 1.15; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1080" height="900" fill="#FBFCFE"/>

