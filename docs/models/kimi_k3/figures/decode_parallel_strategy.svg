<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 900 1150" role="img" aria-labelledby="title desc">
<title id="title">Kimi K3 Decode：MLA、KDA、MoE并行部署</title>
<desc id="desc">三个独立模块纵向排列。MLA与KDA为不同层的Attention选择，不是同层串联。MLA保持请求DP，通过AllToAll转换输出到TP，门控输入AllGather后Column TP，Row TP输出后ReduceScatter回到DP。KDA采用AllGather、Head TP、输出门、Row TP及ReduceScatter。MoE Routed分支采用MC2 EP，Shared分支采用AG–TP–RS。紫色虚线框表示启用多流时可部分重叠的分支区域，不是实测时间线。省略AttnRes和部分前后处理。</desc>
