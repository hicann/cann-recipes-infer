<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 Attention Residual Fusion</title>
  <desc id="desc">High-level Kimi K3 fused two-phase Attention Residual flow. Phase 1 prepares stable softmax statistics from historical block states for every Attention and MLP slot. Phase 2 updates the current partial residual with a sublayer delta and merges it with the historical statistics through online softmax. Attention and MLP computation remain outside the fusion operators.</desc>
  <defs>
    <style>
      svg { background: #ffffff; color: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .panel { fill: #ffffff; stroke: #242424; stroke-width: 1.8; }
      .fusion { fill: #fff8ed; stroke: #a75c2b; stroke-width: 2.3; }
      .input { fill: #f6d8d1; stroke: #242424; stroke-width: 1.4; }
      .compute { fill: #d4e5f8; stroke: #242424; stroke-width: 1.4; }
      .merge { fill: #f0efbd; stroke: #242424; stroke-width: 1.4; }
      .state { fill: #eeeeef; stroke: #242424; stroke-width: 1.4; }
      .io { fill: #ffffff; stroke: #242424; stroke-width: 1.4; }
      .title { font-size: 25px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .section { font-size: 19px; font-weight: 700; dominant-baseline: central; }
      .label { font-size: 17px; font-weight: 650; text-anchor: middle; dominant-baseline: central; }
      .small { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
      .subhead { font-size: 14px; font-weight: 650; fill: #a75c2b; dominant-baseline: central; }
      .flow { fill: none; stroke: #242424; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #777777; stroke-width: 1.6; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#242424"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#777777"/>
    </marker>
  </defs>

  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="800" y="30" class="title">Kimi K3 Attention Residual Fusion</text>

  <!-- Inputs shared by the two phases. -->
  <rect x="25" y="65" width="330" height="420" rx="12" class="panel"/>
  <text x="50" y="92" class="section">Block-level inputs</text>

  <rect x="60" y="125" width="260" height="80" rx="8" class="input"/>
  <text x="190" y="153" class="label">historical block states</text>
  <text x="190" y="180" class="small">FP32 block_residual buffer</text>

  <rect x="60" y="245" width="260" height="95" rx="8" class="input"/>
  <text x="190" y="273" class="label">effective queries</text>
  <text x="190" y="300" class="small">RMSNorm gain * projection weight</text>
  <text x="190" y="323" class="small">Attention + MLP slots</text>

  <rect x="85" y="390" width="210" height="55" rx="8" class="state"/>
  <text x="190" y="417" class="label">valid blocks + epsilon</text>

  <!-- Phase 1 fusion. -->
  <rect x="390" y="65" width="350" height="420" rx="12" class="fusion"/>
  <text x="415" y="92" class="section">Phase 1: prepare</text>

  <rect x="430" y="125" width="270" height="170" rx="9" class="compute"/>
  <text x="565" y="158" class="label">block_attn_res_prepare</text>
  <text x="565" y="198" class="small">RMS-normalized depth scoring</text>
  <text x="565" y="228" class="small">stable Softmax over history</text>
  <text x="565" y="258" class="small">all sublayer slots in one launch</text>

  <rect x="455" y="345" width="220" height="90" rx="8" class="state"/>
  <text x="565" y="374" class="label">historical statistics</text>
  <text x="565" y="401" class="small">numerator N, max m, exp_sum Z</text>
  <text x="565" y="424" class="small">first Attention uses N / Z directly</text>

  <path d="M320 165 H430" class="flow" marker-end="url(#arrow)"/>
  <path d="M320 292 H370 V220 H430" class="flow" marker-end="url(#arrow)"/>
  <path d="M295 417 H370 V270 H430" class="flow" marker-end="url(#arrow)"/>
  <path d="M565 295 V345" class="flow" marker-end="url(#arrow)"/>

  <!-- Phase 2 fusion. -->
  <rect x="775" y="65" width="450" height="420" rx="12" class="fusion"/>
  <text x="800" y="92" class="section">Phase 2: update</text>
  <text x="1200" y="92" class="subhead" text-anchor="end">once per Attention / MLP slot</text>

  <rect x="825" y="125" width="350" height="205" rx="9" class="merge"/>
  <text x="1000" y="158" class="label">block_attn_res_update</text>
  <text x="1000" y="198" class="small">partial += previous sublayer delta (FP32)</text>
  <text x="1000" y="228" class="small">RMS-normalized score for current partial</text>
  <text x="1000" y="258" class="small">online-Softmax merge with (N, m, Z)</text>
  <text x="1000" y="298" class="small">returns AttnRes input + updated partial</text>

  <rect x="870" y="385" width="260" height="60" rx="8" class="state"/>
  <text x="1000" y="407" class="label">running partial residual</text>
  <text x="1000" y="430" class="small">FP32; becomes block output</text>

  <!-- Phase 1 statistics feed Phase 2 without crossing the dynamic loop. -->
  <path d="M675 390 H755 V180 H825" class="flow" marker-end="url(#arrow)"/>
  <path d="M955 330 V385" class="flow" marker-end="url(#arrow)"/>
  <path d="M1045 385 V330" class="flow" marker-end="url(#arrow)"/>

  <!-- Effective queries are reused by Phase 2 for the current slot. -->
  <path d="M320 292 H365 V515 H755 V245 H825" class="dashed" marker-end="url(#arrow-gray)"/>

  <!-- Attention / MLP remain outside the fusion kernels. -->
  <rect x="1260" y="65" width="315" height="420" rx="12" class="panel"/>
  <text x="1285" y="92" class="section">Sequential layer execution</text>

  <rect x="1300" y="130" width="235" height="70" rx="8" class="io"/>
  <text x="1417.5" y="156" class="label">AttnRes output</text>
  <text x="1417.5" y="181" class="small">Attention or MLP input</text>
  <path d="M1175 205 H1300" class="flow" marker-end="url(#arrow)"/>

  <rect x="1300" y="255" width="235" height="90" rx="8" class="compute"/>
  <text x="1417.5" y="286" class="label">Attention / FFN / MoE</text>
  <text x="1417.5" y="317" class="small">sublayer computation is not fused</text>
  <path d="M1417.5 200 V255" class="flow" marker-end="url(#arrow)"/>

  <rect x="1330" y="395" width="175" height="55" rx="8" class="input"/>
  <text x="1417.5" y="422" class="label">sublayer delta</text>
  <path d="M1417.5 345 V395" class="flow" marker-end="url(#arrow)"/>

  <!-- The produced delta feeds the next slot's Phase 2 update. -->
  <path d="M1330 422 H1245 V500 H800 V285 H825" class="dashed" marker-end="url(#arrow-gray)"/>
</svg>
