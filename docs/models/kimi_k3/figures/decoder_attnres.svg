<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 700" width="1680" height="700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 Block AttnRes two-phase computation</title>
  <desc id="desc">Phase one batches the attention between every sublayer query and the historical block states, producing independent Softmax statistics for the Attention and FFN/MoE AttnRes slots. Phase two processes the current block sequentially and uses Online Softmax to merge the dynamic partial into each slot's statistics. Attention and FFN/MoE outputs accumulate into the current block partial.</desc>
  <defs>
    <style>
      svg {
        background: #fff;
        color: #1c1c1e;
        font-family: "MiSans VF", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, Roboto, Arial, "PingFang SC", "Source Han Sans SC",
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .box { stroke: #1c1c1e; stroke-width: 1.35; }
      .panel { fill: #fff; stroke: #1c1c1e; stroke-width: 1.15; stroke-dasharray: 7 5; }
      .anchor { fill: #fff8f8; }
      .phase { fill: #f6d3ce; }
      .stats { fill: #f3f3f4; }
      .combine { fill: #f2f3c1; }
      .norm { fill: #f3f3f4; }
      .attn { fill: #c8dcf5; }
      .ffn { fill: #cbe7cf; }
      .partial { fill: #fff; }
      .update { fill: #fff8f8; }
      .section { fill: #6e6e73; font-size: 16px; font-weight: 650; letter-spacing: 1.2px; dominant-baseline: central; }
      .label { fill: #1c1c1e; font-size: 20px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .label-small { fill: #1c1c1e; font-size: 17px; text-anchor: middle; dominant-baseline: central; }
      .meta { fill: #6e6e73; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
      .math { font-family: KaTeX_Math, "Times New Roman", serif; font-style: italic; }
      .alpha { fill: #b92622; font-family: KaTeX_Math, "Times New Roman", serif; font-size: 23px; font-style: italic; }
      .flow { fill: none; stroke: #1c1c1e; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
      .stats-flow { fill: none; stroke: #824b50; stroke-width: 1.55; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-dark" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.2" refY="4" orient="auto">
      <path d="M0.6,0.6 L8.4,4 L0.6,7.4 z" fill="#1c1c1e"/>
    </marker>
    <marker id="arrow-stats" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.2" refY="4" orient="auto">
      <path d="M0.6,0.6 L8.4,4 L0.6,7.4 z" fill="#824b50"/>
    </marker>
  </defs>

  <rect width="1680" height="700" fill="#fff"/>

  <!-- Phase 1 -->
  <rect x="35" y="30" width="1610" height="225" rx="12" class="panel"/>
  <text x="64" y="61" class="section">PHASE 1 · BATCHED INTER-BLOCK ATTENTION</text>
  <text x="1616" y="61" class="meta" style="text-anchor:end">once at the current block entry</text>

  <rect x="72" y="104" width="168" height="78" rx="8" class="box partial"/>
  <text x="156" y="129" class="label-small">Block entry</text>
  <text x="156" y="158" class="label"><tspan class="math">b</tspan><tspan>n</tspan></text>
  <path d="M240 143 H284" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="295" y="83" width="338" height="120" rx="9" class="box anchor"/>
  <text x="464" y="107" class="label-small">Historical block states</text>
  <rect x="327" y="127" width="48" height="35" rx="5" class="box partial"/>
  <rect x="390" y="127" width="48" height="35" rx="5" class="box partial"/>
  <rect x="552" y="127" width="48" height="35" rx="5" class="box partial"/>
  <text x="351" y="145" class="label-small"><tspan class="math">b</tspan><tspan>₀</tspan></text>
  <text x="414" y="145" class="label-small"><tspan class="math">b</tspan><tspan>₁</tspan></text>
  <text x="495" y="145" class="meta">···</text>
  <text x="576" y="145" class="label-small"><tspan class="math">b</tspan><tspan>ₙ₋₁</tspan></text>
  <text x="464" y="184" class="meta">[<tspan class="math">b</tspan><tspan>₀, ..., </tspan><tspan class="math">b</tspan><tspan>ₙ₋₁]</tspan></text>

  <path d="M633 143 H707" class="flow" marker-end="url(#arrow-dark)"/>
  <rect x="718" y="94" width="304" height="98" rx="9" class="box phase"/>
  <text x="870" y="124" class="label">Batched inter-block attention</text>
  <text x="870" y="158" class="label-small">all Attention and FFN/MoE queries</text>

  <path d="M1022 143 H1120" class="flow" marker-end="url(#arrow-dark)"/>
  <rect x="1131" y="94" width="374" height="98" rx="9" class="box stats"/>
  <text x="1318" y="124" class="label">Per-slot Softmax statistics</text>
  <text x="1318" y="159" class="label-small">(<tspan class="math">m</tspan><tspan>ₛ, </tspan><tspan class="math">Z</tspan><tspan>ₛ, </tspan><tspan class="math">N</tspan><tspan>ₛ)</tspan></text>

  <!-- Phase 2 -->
  <rect x="35" y="285" width="1610" height="380" rx="12" class="panel"/>
  <text x="64" y="316" class="section">PHASE 2 · SEQUENTIAL INTRA-BLOCK COMPUTATION</text>
  <text x="1616" y="316" class="meta" style="text-anchor:end">Online Softmax merge</text>

  <!-- Per-slot statistics dependencies -->
  <path d="M1238 192 V337 H320 V364" class="stats-flow" marker-end="url(#arrow-stats)"/>
  <path d="M1402 192 V474 H915 V499" class="stats-flow" marker-end="url(#arrow-stats)"/>

  <!-- Attention half -->
  <rect x="74" y="376" width="126" height="70" rx="35" class="box partial"/>
  <text x="137" y="399" class="label-small">block partial <tspan class="math">p</tspan></text>
  <text x="137" y="426" class="meta">∅ at block start</text>
  <path d="M200 411 H234" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="245" y="365" width="170" height="90" rx="9" class="box combine"/>
  <text x="330" y="394" class="meta">Online Softmax</text>
  <text x="330" y="426" class="label-small">Attention (<tspan class="alpha">α_A</tspan>)</text>
  <path d="M415 410 H449" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="460" y="376" width="132" height="70" rx="8" class="box norm"/>
  <text x="526" y="401" class="label-small">Input</text>
  <text x="526" y="426" class="label-small">RMSNorm</text>
  <path d="M592 411 H626" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="637" y="365" width="174" height="90" rx="9" class="box attn"/>
  <text x="724" y="399" class="label">Attention</text>
  <text x="724" y="431" class="label-small">delta <tspan class="math">a</tspan></text>
  <path d="M811 410 H845" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="856" y="365" width="204" height="90" rx="9" class="box update"/>
  <text x="958" y="396" class="label-small">Update partial</text>
  <text x="958" y="429" class="label"><tspan class="math">p</tspan><tspan> ← </tspan><tspan class="math">a</tspan><tspan> / </tspan><tspan class="math">p</tspan><tspan> + </tspan><tspan class="math">a</tspan></text>

  <!-- FFN half -->
  <path d="M958 455 V499" class="flow" marker-end="url(#arrow-dark)"/>
  <rect x="830" y="510" width="170" height="90" rx="9" class="box combine"/>
  <text x="915" y="539" class="meta">Online Softmax</text>
  <text x="915" y="571" class="label-small">FFN/MoE (<tspan class="alpha">α_F</tspan>)</text>
  <path d="M1000 555 H1034" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="1045" y="520" width="140" height="70" rx="8" class="box norm"/>
  <text x="1115" y="545" class="label-small">Post-attn</text>
  <text x="1115" y="570" class="label-small">RMSNorm</text>
  <path d="M1185 555 H1219" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="1230" y="510" width="160" height="90" rx="9" class="box ffn"/>
  <text x="1310" y="543" class="label">FFN / MoE</text>
  <text x="1310" y="576" class="label-small">delta <tspan class="math">f</tspan></text>
  <path d="M1390 555 H1424" class="flow" marker-end="url(#arrow-dark)"/>

  <rect x="1435" y="510" width="160" height="90" rx="9" class="box update"/>
  <text x="1515" y="543" class="label-small">Update partial</text>
  <text x="1515" y="576" class="label"><tspan class="math">p</tspan><tspan> ← </tspan><tspan class="math">p</tspan><tspan> + </tspan><tspan class="math">f</tspan></text>
  <text x="1515" y="625" class="meta">next layer · block output</text>
</svg>
