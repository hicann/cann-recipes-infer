<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800" width="1800" height="800" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 Stable LatentMoE and SiTU architecture</title>
  <desc id="desc">The hidden state branches to a sigmoid router, a latent routed-expert path, and a shared-expert path. Correction bias affects Top-16 expert selection, while renormalized sigmoid scores combine the selected expert outputs. Each routed expert applies gate-up projection, gate and up transformations, multiplication, and down projection in latent space. The combined routed output passes through latent RMSNorm and latent up projection, then adds the shared expert output.</desc>
  <defs>
    <style>
      svg {
        background: #fff;
        color: #1c1c1e;
        font-family: "MiSans VF", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, Roboto, Arial, "PingFang SC", "Source Han Sans SC",
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .panel { fill: #fff; stroke: #1c1c1e; stroke-width: 1.2; stroke-dasharray: 8 6; }
      .box { stroke: #1c1c1e; stroke-width: 1.25; }
      .projection { fill: #f6d3ce; }
      .routed { fill: #dcdff0; }
      .shared { fill: #cbe7cf; }
      .gate { fill: #f2f3c1; }
      .compute { fill: #c8dcf5; }
      .routing { fill: #eef8eb; }
      .io { fill: #fff; }
      .label {
        fill: #1c1c1e;
        font-size: 20px;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .label-small {
        fill: #1c1c1e;
        font-size: 18px;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .formula {
        fill: #1c1c1e;
        font-family: "Times New Roman", "STIX Two Math", serif;
        font-size: 18px;
        font-style: italic;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .annotation {
        fill: #4a4a4e;
        font-size: 15px;
        font-weight: 500;
        text-anchor: middle;
      }
      .section {
        fill: #1c1c1e;
        font-size: 21px;
        font-weight: 620;
        dominant-baseline: central;
      }
      .flow {
        fill: none;
        stroke: #1c1c1e;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .control {
        fill: none;
        stroke: #66885c;
        stroke-width: 1.6;
        stroke-dasharray: 6 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .control-label {
        fill: #43623b;
        font-size: 15px;
        font-weight: 500;
        text-anchor: middle;
      }
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.2" refY="4" orient="auto">
      <path d="M0.6,0.6 L8.4,4 L0.6,7.4 z" fill="#1c1c1e"/>
    </marker>
    <marker id="control-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8.2" refY="4" orient="auto">
      <path d="M0.6,0.6 L8.4,4 L0.6,7.4 z" fill="#66885c"/>
    </marker>
  </defs>

  <rect width="1800" height="800" fill="#fff"/>

  <!-- Module-level stages -->
  <rect x="180" y="38" width="300" height="724" rx="12" class="panel"/>
  <text x="208" y="70" class="section">Input Paths</text>

  <rect x="500" y="38" width="1050" height="500" rx="12" class="panel"/>
  <text x="528" y="70" class="section">Routed Experts · SiTU</text>

  <rect x="500" y="558" width="1050" height="204" rx="12" class="panel"/>
  <text x="528" y="590" class="section">Shared Expert</text>

  <rect x="1570" y="38" width="195" height="724" rx="12" class="panel"/>
  <text x="1598" y="70" class="section">Output</text>

  <!-- Hidden-state fan-out -->
  <rect x="26" y="367" width="114" height="66" rx="33" class="box io"/>
  <text x="83" y="400" class="label">xₜ</text>
  <path d="M140 400 H160" class="flow"/>
  <path d="M160 145 V660" class="flow"/>

  <!-- Router path -->
  <path d="M160 145 H220" class="flow" marker-end="url(#arrow)"/>
  <rect x="220" y="110" width="200" height="70" rx="5" class="box routing"/>
  <text x="320" y="145" class="label-small">Sigmoid Router</text>

  <path d="M320 180 V220" class="flow" marker-end="url(#arrow)"/>
  <rect x="220" y="220" width="200" height="70" rx="5" class="box routing"/>
  <text x="320" y="245" class="label-small">Top-16 Selection</text>
  <text x="320" y="268" class="annotation">+ correction bias</text>

  <!-- Latent routed payload -->
  <path d="M160 365 H220" class="flow" marker-end="url(#arrow)"/>
  <rect x="220" y="330" width="200" height="70" rx="5" class="box projection"/>
  <text x="320" y="365" class="label-small">Latent Down</text>

  <!-- Shared payload leaves input panel unchanged -->
  <path d="M160 660 H540" class="flow" marker-end="url(#arrow)"/>

  <!-- Top-16 metadata: ids select experts, weights combine outputs -->
  <path d="M420 255 H520 V105 H632 V325" class="control" marker-end="url(#control-arrow)"/>
  <text x="590" y="97" class="control-label">Top-16 expert IDs</text>

  <path d="M520 105 H1410 V320" class="control" marker-end="url(#control-arrow)"/>
  <text x="1258" y="97" class="control-label">renormalized sigmoid scores</text>

  <!-- Routed expert MLP in latent space -->
  <path d="M420 365 H540" class="flow" marker-end="url(#arrow)"/>
  <rect x="540" y="325" width="184" height="80" rx="5" class="box projection"/>
  <text x="632" y="352" class="label-small">Top-16 experts</text>
  <text x="632" y="378" class="label-small">gate_up_proj</text>

  <!-- gate_up split -->
  <path d="M724 365 H755" class="flow"/>
  <path d="M755 365 V235 H790" class="flow" marker-end="url(#arrow)"/>
  <path d="M755 365 V435 H790" class="flow" marker-end="url(#arrow)"/>

  <rect x="790" y="190" width="250" height="90" rx="6" class="box gate"/>
  <text x="915" y="215" class="label-small">Gate Branch</text>
  <text x="915" y="249" class="formula">β<tspan baseline-shift="sub" font-size="13">g</tspan> tanh(g / β<tspan baseline-shift="sub" font-size="13">g</tspan>) · σ(g)</text>

  <rect x="790" y="390" width="250" height="90" rx="6" class="box gate"/>
  <text x="915" y="415" class="label-small">Up Branch</text>
  <text x="915" y="449" class="formula">β<tspan baseline-shift="sub" font-size="13">u</tspan> tanh(u / β<tspan baseline-shift="sub" font-size="13">u</tspan>)</text>

  <!-- SiTU multiply -->
  <path d="M1040 235 H1080 V343" class="flow" marker-end="url(#arrow)"/>
  <path d="M1040 435 H1080 V387" class="flow" marker-end="url(#arrow)"/>
  <circle cx="1080" cy="365" r="22" class="box compute"/>
  <text x="1080" y="365" class="label">⊙</text>
  <text x="1080" y="408" class="annotation">SiTU</text>

  <path d="M1102 365 H1135" class="flow" marker-end="url(#arrow)"/>
  <rect x="1135" y="330" width="145" height="70" rx="5" class="box projection"/>
  <text x="1207.5" y="365" class="label-small">down_proj</text>

  <!-- Top-16 weighted expert combine -->
  <path d="M1280 365 H1320" class="flow" marker-end="url(#arrow)"/>
  <rect x="1320" y="320" width="180" height="90" rx="6" class="box routed"/>
  <text x="1410" y="350" class="label-small">Weighted Combine</text>
  <text x="1410" y="378" class="label-small">normalized weights</text>

  <!-- Shared expert uses the same activation -->
  <rect x="540" y="625" width="190" height="70" rx="5" class="box projection"/>
  <text x="635" y="660" class="label-small">gate_up_proj</text>

  <path d="M730 660 H790" class="flow" marker-end="url(#arrow)"/>
  <rect x="790" y="615" width="260" height="90" rx="6" class="box shared"/>
  <text x="920" y="646" class="label">SiTU</text>
  <text x="920" y="678" class="annotation">gate · up</text>

  <path d="M1050 660 H1110" class="flow" marker-end="url(#arrow)"/>
  <rect x="1110" y="625" width="170" height="70" rx="5" class="box projection"/>
  <text x="1195" y="660" class="label-small">down_proj</text>

  <!-- Restore routed output to model width -->
  <path d="M1500 365 H1588" class="flow" marker-end="url(#arrow)"/>
  <rect x="1588" y="330" width="159" height="70" rx="5" class="box compute"/>
  <text x="1667.5" y="365" class="label-small">Latent RMSNorm</text>

  <path d="M1667.5 400 V440" class="flow" marker-end="url(#arrow)"/>
  <rect x="1588" y="440" width="159" height="70" rx="5" class="box projection"/>
  <text x="1667.5" y="475" class="label-small">Latent Up</text>

  <!-- Shared and routed branches join only after latent up -->
  <path d="M1667.5 510 V553" class="flow" marker-end="url(#arrow)"/>
  <path d="M1280 660 H1545 V575 H1645" class="flow" marker-end="url(#arrow)"/>
  <circle cx="1667.5" cy="575" r="22" class="box compute"/>
  <text x="1667.5" y="575" class="label">+</text>

  <path d="M1667.5 597 V650" class="flow" marker-end="url(#arrow)"/>
  <rect x="1610.5" y="650" width="114" height="66" rx="33" class="box io"/>
  <text x="1667.5" y="683" class="label">yₜ</text>
</svg>
