<svg xmlns="http://www.w3.org/2000/svg" width="1011" height="328" viewBox="0 0 1011 328" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V3.2 KV Offload 数据流</title>
  <desc id="desc">从主机端完整 KV Cache 按需 Gather 出设备端选中 KV 的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/></marker>
    <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202938}.label{font-size:20px}.box{stroke:#bfd7ff;stroke-width:2;fill:#f2f7ff}.host{stroke:#ffcaa9;stroke-width:2;fill:#fff4ee}.thin{stroke:#969696;stroke-width:2;fill:none}.divider{stroke:#d97706;stroke-width:2;stroke-dasharray:8 7}</style>
  </defs>
  <rect width="1011" height="328" fill="white"/>
  <text x="24" y="157" class="label">设备侧内存</text>
  <text x="24" y="192" class="label">主机侧内存</text>
  <line x1="24" y1="170" x2="987" y2="170" class="divider"/>
  <rect x="420" y="27" width="171" height="42" class="box"/>
  <text x="505.5" y="54" text-anchor="middle" font-size="17">Selected KV (2K)</text>
  <text x="505.5" y="124" text-anchor="middle" font-size="18">Gather</text>
  <line x1="505" y1="102" x2="505" y2="73" class="thin" marker-end="url(#arrow)"/>
  <path d="M499 83L505 73L511 83Z" fill="#8b8b8b"/>
  <rect x="195" y="226" width="620" height="44" class="host"/>
  <text x="505" y="254" text-anchor="middle" font-size="18">Full KV</text>
  <line x1="505" y1="224" x2="505" y2="138" class="thin"/>
</svg>
