<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">不同执行模式与热点 KV 池大小下的吞吐对比</title><desc id="desc">比较 GE Graph 和 NPUGraph Ex 在无 Offload、8K 与 16K 热点 KV 池下的实际吞吐。</desc>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#2b3b4b}.grid{stroke:#dce3e9;stroke-width:1}.axis{stroke:#9eacb9;stroke-width:1.5}.tick{font-size:18px;fill:#607386}.label{font-size:24px;font-weight:600}.value{font-size:23px}.gain-ge{font-size:17px;font-weight:600;fill:#4e7591}.gain-npu{font-size:17px;font-weight:600;fill:#71639b}</style>
  <rect width="1600" height="780" fill="white"/><text x="180" y="90" class="label">吞吐（token/s）</text>
  <g><line x1="180" y1="110" x2="1500" y2="110" class="grid"/><line x1="180" y1="166" x2="1500" y2="166" class="grid"/><line x1="180" y1="280" x2="1500" y2="280" class="grid"/><line x1="180" y1="393" x2="1500" y2="393" class="grid"/><line x1="180" y1="507" x2="1500" y2="507" class="grid"/><line x1="180" y1="620" x2="1500" y2="620" class="axis"/><line x1="180" y1="110" x2="180" y2="620" class="axis"/></g>
  <g text-anchor="end" class="tick"><text x="156" y="626">0</text><text x="156" y="513">1,000</text><text x="156" y="399">2,000</text><text x="156" y="286">3,000</text><text x="156" y="172">4,000</text><text x="156" y="116">4,500</text></g>
  <g><rect x="1115" y="45" width="22" height="14" rx="3" fill="#82a9bf" stroke="#547d95"/><text x="1146" y="59" font-size="18">GE Graph</text><rect x="1278" y="45" width="22" height="14" rx="3" fill="#9185b5" stroke="#6f6395"/><text x="1309" y="59" font-size="18">NPUGraph Ex</text></g>
  <g stroke-width="1.5"><rect x="283" y="336" width="106" height="284" rx="5" fill="#82a9bf" stroke="#547d95"/><rect x="412" y="336" width="106" height="284" rx="5" fill="#9185b5" stroke="#6f6395"/><rect x="683" y="207" width="106" height="413" rx="5" fill="#82a9bf" stroke="#547d95"/><rect x="812" y="229" width="106" height="391" rx="5" fill="#9185b5" stroke="#6f6395"/><rect x="1083" y="168" width="106" height="452" rx="5" fill="#82a9bf" stroke="#547d95"/><rect x="1212" y="190" width="106" height="430" rx="5" fill="#9185b5" stroke="#6f6395"/></g>
  <g text-anchor="middle"><text x="336" y="307" class="value">2,504</text><text x="336" y="328" class="gain-ge">基线</text><text x="465" y="307" class="value">2,507</text><text x="465" y="328" class="gain-npu">基线</text><text x="736" y="178" class="value">3,642</text><text x="736" y="199" class="gain-ge">+45.4%</text><text x="865" y="200" class="value">3,452</text><text x="865" y="221" class="gain-npu">+37.7%</text><text x="1136" y="139" class="value">3,982</text><text x="1136" y="160" class="gain-ge">+59.0%</text><text x="1265" y="161" class="value">3,791</text><text x="1265" y="182" class="gain-npu">+51.2%</text></g>
  <g class="label" text-anchor="middle"><text x="400" y="670">无 Offload</text><text x="800" y="670">Offload-8K</text><text x="1200" y="670">Offload-16K</text></g>
</svg>
