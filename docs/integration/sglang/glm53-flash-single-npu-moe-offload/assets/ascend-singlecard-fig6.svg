<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" aria-label="A3 与 A5 卸载结构对照：A3 驻留 32 外置 224 两侧异构，A5 驻留 160 外置 96 两侧同构"><rect x="-20" y="-20" width="740" height="370" fill="#FFFFFF"/>
  <!-- A3 -->
  <text x="0" y="14" font-size="11" font-weight="600" fill="#161A20">A3 · 61.3 GiB HBM · host ARM</text>
  <rect x="0" y="22" width="700" height="52" rx="3" fill="#D6ECEE" opacity="0.5"/>
  <rect x="0" y="82" width="700" height="60" rx="3" fill="#F3E4D6" opacity="0.55"/>
  <text x="8" y="36" font-family="IBM Plex Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="1" fill="#0E7C86">DEVICE</text>
  <text x="8" y="96" font-family="IBM Plex Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="1" fill="#A85C24">HOST</text>

  <rect x="70" y="44" width="62.5" height="22" rx="2" fill="#0E7C86" opacity="0.55" stroke="#0E7C86" stroke-width="1.2"/>
  <text x="76" y="60" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#0E7C86">32</text>
  <text x="560" y="53" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#0E7C86">INT8 W8A8</text>
  <text x="560" y="65" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">12.5% 驻留</text>

  <rect x="70" y="104" width="420" height="22" rx="2" fill="#A85C24" opacity="0.42" stroke="#A85C24" stroke-width="1.2"/>
  <text x="76" y="120" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#A85C24">224</text>
  <text x="560" y="113" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#A85C24">MXFP4 · GGUF</text>
  <text x="560" y="125" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">87.5% 外置 · LLAMAFILE</text>

  <path d="M300 74 L300 104" stroke="#9C2F46" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M300 104 l-4 -8 h8 z" fill="#9C2F46"/><path d="M300 74 l-4 8 h8 z" fill="#9C2F46"/>
  <rect x="318" y="78" width="212" height="20" rx="2" fill="#F5DEE3" stroke="#9C2F46" stroke-width="1"/>
  <text x="328" y="92" font-size="9.5" font-weight="600" fill="#9C2F46">格式不同 · 迁移需 requantize</text>
  <text x="8" y="136" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">离线 GGUF 转换为前置条件</text>

  <line x1="0" y1="162" x2="660" y2="162" stroke="#D8DEE5" stroke-dasharray="4 4"/>

  <!-- A5 -->
  <text x="0" y="188" font-size="11" font-weight="600" fill="#161A20">A5 · 128 GiB HBM · host x86</text>
  <rect x="0" y="196" width="700" height="52" rx="3" fill="#D6ECEE" opacity="0.5"/>
  <rect x="0" y="256" width="700" height="60" rx="3" fill="#F3E4D6" opacity="0.55"/>
  <text x="8" y="210" font-family="IBM Plex Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="1" fill="#0E7C86">DEVICE</text>
  <text x="8" y="270" font-family="IBM Plex Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="1" fill="#A85C24">HOST</text>

  <rect x="70" y="218" width="312.5" height="22" rx="2" fill="#0E7C86" opacity="0.55" stroke="#0E7C86" stroke-width="1.2"/>
  <text x="76" y="234" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#0E7C86">160</text>
  <text x="560" y="227" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#0E7C86">原生 MXFP4</text>
  <text x="560" y="239" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">62.5% 驻留</text>

  <rect x="70" y="278" width="187.5" height="22" rx="2" fill="#A85C24" opacity="0.42" stroke="#A85C24" stroke-width="1.2"/>
  <text x="76" y="294" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#A85C24">96</text>
  <text x="560" y="287" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#A85C24">原生 MXFP4</text>
  <text x="560" y="299" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">37.5% 外置 · AVX512-BF16</text>

  <path d="M300 248 L300 278" stroke="#0E7C86" stroke-width="1.6"/>
  <path d="M300 278 l-4 -8 h8 z" fill="#0E7C86"/><path d="M300 248 l-4 8 h8 z" fill="#0E7C86"/>
  <rect x="318" y="252" width="212" height="20" rx="2" fill="#D6ECEE" stroke="#0E7C86" stroke-width="1"/>
  <text x="328" y="266" font-size="9.5" font-weight="600" fill="#0E7C86">格式一致 · 迁移无需转换</text>
  <text x="8" y="310" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">直读官方 safetensors</text>

  <rect x="0" y="322" width="660" height="8" rx="2" fill="none"/>
</svg>
