<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="250" viewBox="0 0 1040 250" role="img" aria-label="单个 MoE 层的三条执行线协调序列：上半为 device 侧的 compute stream，下半为 host 侧的 callback 线程与 CPU 线程池"><rect x="-20" y="-20" width="1080" height="290" fill="#FFFFFF"/>
        <!-- device / host 分区带 -->
        <rect x="0" y="28" width="8" height="48" rx="2" fill="#0E7C86"/>
        <rect x="0" y="90" width="8" height="92" rx="2" fill="#A85C24"/>
        <text x="24" y="52" transform="rotate(-90 24 52)" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#0E7C86">DEVICE</text>
        <text x="24" y="136" transform="rotate(-90 24 136)" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#A85C24">HOST</text>
        <line x1="0" y1="83" x2="1032" y2="83" stroke="#D8DEE5" stroke-width="1" stroke-dasharray="5 4"/>

        <!-- 泳道 -->
        <g>
          <rect x="180" y="28" width="840" height="48" rx="3" fill="#D6ECEE" opacity="0.6"/>
          <rect x="180" y="90" width="840" height="40" rx="3" fill="#F3E4D6" opacity="0.35"/>
          <rect x="180" y="142" width="840" height="40" rx="3" fill="#F3E4D6" opacity="0.6"/>
        </g>
        <g font-size="13" font-weight="600">
          <text x="40" y="48" fill="#0E7C86">compute stream</text>
          <text x="40" y="64" font-size="10.5" font-weight="400" fill="#6B7686">图内重放</text>
          <text x="40" y="106" fill="#A85C24">callback 线程</text>
          <text x="40" y="122" font-size="10.5" font-weight="400" fill="#6B7686">host 常驻</text>
          <text x="40" y="158" fill="#A85C24">CPU 线程池</text>
          <text x="40" y="174" font-size="10.5" font-weight="400" fill="#6B7686">动态分配</text>
        </g>

        <!-- 计算流事件 -->
        <g font-family="IBM Plex Mono, monospace" font-size="11">
          <rect x="190" y="34" width="68" height="36" rx="2" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.2"/>
          <text x="224" y="57" text-anchor="middle" fill="#0E7C86">router</text>

          <rect x="268" y="34" width="128" height="36" rx="2" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.6"/>
          <text x="332" y="51" text-anchor="middle" fill="#161A20">写 pinned buffer</text>
          <text x="332" y="64" text-anchor="middle" font-size="9" fill="#6B7686">buf[L % 2]</text>

          <rect x="406" y="34" width="108" height="36" rx="2" fill="#0E7C86" opacity="0.22" stroke="#0E7C86" stroke-width="1.6"/>
          <text x="460" y="51" text-anchor="middle" fill="#161A20">投递 callback</text>
          <text x="460" y="64" text-anchor="middle" font-size="9" fill="#0E7C86">图节点</text>

          <rect x="524" y="34" width="312" height="36" rx="2" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.2"/>
          <text x="680" y="57" text-anchor="middle" fill="#0E7C86">dispatch + 驻留专家 + combine</text>

          <rect x="846" y="34" width="166" height="36" rx="2" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.6"/>
          <text x="929" y="51" text-anchor="middle" fill="#161A20">等待 → 相加</text>
          <text x="929" y="64" text-anchor="middle" font-size="9" fill="#6B7686">hidden += cpu_out</text>
        </g>

        <!-- 回调线程 -->
        <g font-family="IBM Plex Mono, monospace" font-size="11">
          <rect x="190" y="96" width="240" height="28" rx="2" fill="#FFFFFF" stroke="#A85C24" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="310" y="115" text-anchor="middle" fill="#6B7686">aclrtProcessReport 轮询</text>
          <rect x="470" y="96" width="160" height="28" rx="2" fill="#FFFFFF" stroke="#A85C24" stroke-width="1.6"/>
          <text x="550" y="115" text-anchor="middle" fill="#161A20">派发 host func</text>
        </g>

        <!-- CPU 池 -->
        <g font-family="IBM Plex Mono, monospace" font-size="11">
          <rect x="524" y="148" width="302" height="28" rx="2" fill="#A85C24" opacity="0.32" stroke="#A85C24" stroke-width="1.6"/>
          <text x="675" y="167" text-anchor="middle" fill="#A85C24" font-weight="600">外置专家 · 读 MXFP4 权重</text>
          <rect x="846" y="148" width="166" height="28" rx="2" fill="#FFFFFF" stroke="#A85C24" stroke-width="1.2"/>
          <text x="929" y="167" text-anchor="middle" fill="#A85C24">写回 buffer</text>
        </g>

        <!-- 跨泳道箭头 -->
        <g stroke-width="1.6" fill="none">
          <path d="M460 70 L512 92" stroke="#0E7C86" marker-end="url(#a1)"/>
          <path d="M550 124 L596 144" stroke="#A85C24" marker-end="url(#a2)"/>
          <path d="M929 144 L929 76" stroke="#A85C24" stroke-dasharray="4 3" marker-end="url(#a3)"/>
        </g>
        <defs>
          <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0E7C86"/></marker>
          <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#A85C24"/></marker>
          <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#A85C24"/></marker>
        </defs>

        <!-- 重叠区标注 -->
        <line x1="524" y1="202" x2="836" y2="202" stroke="#9C2F46" stroke-width="1.8"/>
        <path d="M524 202 l7 -4 v8 z" fill="#9C2F46"/>
        <path d="M836 202 l-7 -4 v8 z" fill="#9C2F46"/>
        <text x="680" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#9C2F46">
          重叠区间：device 驻留专家与 host 外置专家并行
        </text>
        <text x="680" y="240" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6B7686">
          该区间的长度即第 5.2 节的可重叠部分
        </text>
      </svg>
