<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-label="线程池的任务分配：任务为专家切片对，所有线程抢同一个原子计数器，每次取一个任务"><rect x="-20" y="-20" width="740" height="340" fill="#FFFFFF"/>
  <defs>
    <marker id="q1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#0E7C86"/></marker>
  </defs>

  <!-- 任务队列 -->
  <text x="0" y="16" font-size="10.5" font-weight="600" fill="#161A20">任务表 · nth × 激活专家数</text>
  <text x="0" y="31" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#6B7686">task_id → expert = task_id / nth，slice = task_id % nth</text>

  <!-- 专家 E0 热 / E1 冷 / E2 中 -->
  <g font-family="IBM Plex Mono, monospace" font-size="8">
    <text x="0" y="60" fill="#A85C24" font-weight="600">E0</text>
    <text x="0" y="60" fill="#A85C24" font-weight="600"></text>
    <rect x="24" y="46" width="46" height="18" rx="2" fill="#A85C24" opacity="0.62" stroke="#A85C24"/>
    <rect x="72" y="46" width="46" height="18" rx="2" fill="#A85C24" opacity="0.62" stroke="#A85C24"/>
    <rect x="120" y="46" width="46" height="18" rx="2" fill="#A85C24" opacity="0.62" stroke="#A85C24"/>
    <rect x="168" y="46" width="46" height="18" rx="2" fill="#A85C24" opacity="0.62" stroke="#A85C24"/>
    <text x="228" y="59" fill="#A85C24">128 token · 每片贵</text>

    <text x="0" y="88" fill="#A85C24" font-weight="600">E1</text>
    <rect x="24" y="74" width="46" height="18" rx="2" fill="#A85C24" opacity="0.2" stroke="#A85C24"/>
    <rect x="72" y="74" width="46" height="18" rx="2" fill="#A85C24" opacity="0.2" stroke="#A85C24"/>
    <rect x="120" y="74" width="46" height="18" rx="2" fill="#A85C24" opacity="0.2" stroke="#A85C24"/>
    <rect x="168" y="74" width="46" height="18" rx="2" fill="#A85C24" opacity="0.2" stroke="#A85C24"/>
    <text x="228" y="87" fill="#6B7686">9 token · 每片便宜</text>

    <text x="0" y="116" fill="#A85C24" font-weight="600">E2</text>
    <rect x="24" y="102" width="46" height="18" rx="2" fill="#A85C24" opacity="0.4" stroke="#A85C24"/>
    <rect x="72" y="102" width="46" height="18" rx="2" fill="#A85C24" opacity="0.4" stroke="#A85C24"/>
    <rect x="120" y="102" width="46" height="18" rx="2" fill="#A85C24" opacity="0.4" stroke="#A85C24"/>
    <rect x="168" y="102" width="46" height="18" rx="2" fill="#A85C24" opacity="0.4" stroke="#A85C24"/>
    <text x="228" y="115" fill="#6B7686">41 token</text>
  </g>
  <text x="24" y="136" font-family="IBM Plex Mono, monospace" font-size="8" fill="#6B7686">slice 0</text>
  <text x="72" y="136" font-family="IBM Plex Mono, monospace" font-size="8" fill="#6B7686">slice 1</text>
  <text x="120" y="136" font-family="IBM Plex Mono, monospace" font-size="8" fill="#6B7686">slice 2</text>
  <text x="168" y="136" font-family="IBM Plex Mono, monospace" font-size="8" fill="#6B7686">slice 3</text>
  <text x="400" y="136" font-size="9.5" fill="#414B58">色深 = 该片计算量，正比于路由到该专家的 token 数</text>

  <!-- 原子计数器 -->
  <rect x="236" y="164" width="186" height="42" rx="3" fill="#D6ECEE" stroke="#0E7C86" stroke-width="1.8"/>
  <text x="329" y="182" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#0E7C86">
    curr_.fetch_add(1)
  </text>
  <text x="329" y="197" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#0E7C86">
    共享原子计数器 · block = 1
  </text>

  <!-- 线程指向计数器 -->
  <g stroke="#0E7C86" stroke-width="1.4" fill="none">
    <path d="M100 250 C100 220 220 214 232 196" marker-end="url(#q1)"/>
    <path d="M212 250 C212 226 224 214 234 200" marker-end="url(#q1)"/>
    <path d="M446 250 C446 226 434 214 424 200" marker-end="url(#q1)"/>
    <path d="M558 250 C558 220 438 214 426 196" marker-end="url(#q1)"/>
  </g>

  <!-- 四个线程 -->
  <g font-family="IBM Plex Mono, monospace" font-size="9">
    <rect x="56" y="254" width="90" height="30" rx="2" fill="#0E7C86" opacity="0.3" stroke="#0E7C86" stroke-width="1.4"/>
    <text x="101" y="266" text-anchor="middle" font-weight="600" fill="#0E7C86">t0 · 提交线程</text>
    <text x="101" y="278" text-anchor="middle" font-size="8" fill="#6B7686">唤醒后自己加入</text>

    <rect x="168" y="254" width="88" height="30" rx="2" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="212" y="273" text-anchor="middle" fill="#414B58">t1</text>
    <rect x="402" y="254" width="88" height="30" rx="2" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="446" y="273" text-anchor="middle" fill="#414B58">t2</text>
    <rect x="514" y="254" width="88" height="30" rx="2" fill="#FFFFFF" stroke="#D8DEE5"/>
    <text x="558" y="273" text-anchor="middle" fill="#414B58">t3</text>
  </g>

  <!-- 三阶段 -->
  <rect x="470" y="164" width="190" height="42" rx="3" fill="#EDF0F3"/>
  <text x="480" y="179" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#414B58">init(thread_id)      每线程一次</text>
  <text x="480" y="191" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#161A20">compute(task_id)     每任务一次</text>
  <text x="480" y="203" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#414B58">finalize(thread_id)  每线程一次</text>
</svg>
